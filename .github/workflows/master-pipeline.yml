name: Master CI/CD Test Pipeline & ZIP Packager

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  master-test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Install Node Dependencies
        run: |
          cd "Smart Finance AI E2E"
          npm install

      - name: Generate All 4 Category Excel Reports
        run: |
          node scripts/generate_projects_and_reports.js
          python scripts/package_test_zip.py
          node scripts/prepare_github_artifacts.js

      - name: Execute Pytest Suite (All Categories)
        run: |
          pytest tests/ --html=reports/master_test_report.html --self-contained-html || true

      - name: Upload All 4 Test Reports (Excel, CSV, HTML, ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: All_4_Categories_Test_Reports_Excel_And_HTML
          path: |
            Android_Appium_Test_Report.xlsx
            Web_E2E_Test_Report.xlsx
            Vulnerability_Security_Test_Report.xlsx
            Load_Performance_Test_Report.xlsx
            Excel_Reports/All_Test_Results_Master.xlsx
            smart_finance_ai_test_suite.zip
            K6_LOAD_TESTING_GUIDE.md
            Smart Finance AI E2E/Test_Results/CSV/*.csv
            Smart Finance AI E2E/Test_Results/HTML/*.html
