name: Master CI/CD Test Pipeline & ZIP Packager

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  master-test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Install Node Dependencies
        run: |
          cd "Smart Finance AI E2E"
          npm install

      - name: Generate All Test Projects & Excel Reports
        run: |
          node scripts/generate_projects_and_reports.js

      - name: Execute Pytest Suite (All Categories)
        run: |
          pytest tests/ --html=reports/master_test_report.html --self-contained-html || true

      - name: Build Downloadable ZIP Archive
        run: |
          python scripts/package_test_zip.py

      - name: Upload Complete Test Suite ZIP & Excel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart_Finance_AI_Full_Test_Suite_Artifacts
          path: |
            smart_finance_ai_test_suite.zip
            Excel_Reports/All_Test_Results_Master.xlsx
            Android_Appium_Test_Report.xlsx
            Web_E2E_Test_Report.xlsx
            Vulnerability_Security_Test_Report.xlsx
            Load_Performance_Test_Report.xlsx
            K6_LOAD_TESTING_GUIDE.md
