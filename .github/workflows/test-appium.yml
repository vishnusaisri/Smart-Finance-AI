name: Appium Mobile Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --log-level info > appium.log 2>&1 &
          sleep 5

      - name: Run Appium Tests
        run: |
          pytest tests/appium/ --html=reports/appium_report.html --self-contained-html || true

      - name: Upload Appium Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report
          path: reports/appium_report.html
