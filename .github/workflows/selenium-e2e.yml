name: Selenium E2E Web Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Browser Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable firefox

      - name: Install Selenium Suite Dependencies
        run: |
          cd "Smart Finance AI E2E"
          npm install

      - name: Run Selenium Web Tests
        run: |
          cd "Smart Finance AI E2E"
          npm test || true

      - name: Generate Reports
        run: |
          node scripts/generate_projects_and_reports.js

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Web_Selenium_E2E_Artifacts
          path: |
            Web_E2E_Test_Report.xlsx
            Web_E2E_Test_Report_Selenium_Test_Report.csv
            reports/
