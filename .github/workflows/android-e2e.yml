name: Android Mobile Appium E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'android-emulator-e2e'
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-permissions.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo chmod 777 /dev/kvm || true

      - name: Build Android Debug APK
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true
          flutter pub get
          flutter build apk --debug

      - name: Install Appium & E2E Node Dependencies
        run: |
          npm install -g appium@2.5.1
          appium driver install uiautomator2 || true
          cd "Smart Finance AI Appium"
          npm ci || npm install

      - name: Run Appium E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            chmod +x "Smart Finance AI Appium/scripts/ci_run_tests.sh"
            cd "Smart Finance AI Appium"
            ./scripts/ci_run_tests.sh

      - name: Inject E2E Reports into Build Directory
        if: always()
        run: |
          mkdir -p dist/reports/latest
          mkdir -p "dist/reports/history/build-${{ github.run_number }}"
          cp "Smart Finance AI Appium/Test_Results/HTML/execution-report.html" dist/reports/latest/execution-report.html || true
          cp "Smart Finance AI Appium/Test_Results/HTML/execution-report.html" "dist/reports/history/build-${{ github.run_number }}/execution-report.html" || true

      - name: Deploy Reports to GitHub Pages (gh-pages Branch)
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
