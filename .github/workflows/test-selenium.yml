name: Selenium Web Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Web Application
        run: |
          flutter pub get
          flutter build web --release

      - name: Start Web Server
        run: |
          python -m http.server 49390 --directory build/web &
          sleep 3

      - name: Run Selenium Web Tests
        run: |
          pytest tests/selenium/ --html=reports/selenium_report.html --self-contained-html || true

      - name: Upload Selenium Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: reports/selenium_report.html
